<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중고책 API 테스트</title>
<!--
  백엔드 수동 테스트용 임시 페이지 (실제 프론트 아님)
  실행: backend/http 폴더에서  python3 -m http.server 5173
       → 브라우저에서 http://localhost:5173/book-tester.html
  (백엔드 CORS 허용 주소가 localhost:5173 이라 이 포트로 띄워야 함)
-->
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#dde1e6; --text:#1f2328; --muted:#667085; --accent:#2563eb; --ok:#15803d; --err:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system, "Apple SD Gothic Neo", sans-serif; background:var(--bg); color:var(--text); }
  header { padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  .who { color:var(--muted); }
  main { display:grid; grid-template-columns: 340px 1fr 380px; gap:12px; padding:12px; }
  @media (max-width:1100px){ main { grid-template-columns:1fr; } }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; }
  h2 { font-size:14px; margin:0 0 8px; }
  label { display:block; font-size:12px; color:var(--muted); margin-top:6px; }
  input, select, textarea { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  textarea { min-height:60px; }
  button { padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; font:inherit; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:var(--err); }
  .row { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .row > * { flex:1; }
  .book { border:1px solid var(--line); border-radius:6px; padding:8px; margin-top:8px; }
  .book .t { font-weight:600; }
  .badge { font-size:11px; padding:1px 6px; border-radius:10px; background:#eef2ff; color:#3730a3; margin-left:4px; }
  .badge.SOLD { background:#f1f5f9; color:#475569; } .badge.RESERVED { background:#fef3c7; color:#92400e; } .badge.ON_SALE { background:#dcfce7; color:#166534; }
  .meta { color:var(--muted); font-size:12px; }
  #log { font:12px/1.4 ui-monospace, Menlo, monospace; white-space:pre-wrap; word-break:break-all; max-height:75vh; overflow:auto; }
  .entry { border-bottom:1px solid var(--line); padding:6px 0; }
  .ok { color:var(--ok); } .err { color:var(--err); }
</style>
</head>
<body>
<header>
  <h1>📚 중고책 API 테스트</h1>
  <span class="who" id="who">로그인 안 됨</span>
  <span style="flex:1"></span>
  <label style="margin:0">서버 <input id="host" value="http://localhost:8080/api/v1" style="width:240px"></label>
</header>

<main>
  <!-- 왼쪽: 로그인 / 등록 -->
  <div>
    <section>
      <h2>1. 회원가입 · 로그인</h2>
      <label>이메일</label><input id="email" value="seller@example.com">
      <label>비밀번호 (영문·숫자·특수문자 8~20자)</label><input id="pw" value="Test1234!">
      <label>닉네임 (회원가입 때만)</label><input id="nick" value="판매자">
      <div class="row">
        <button onclick="signup()">회원가입</button>
        <button class="primary" onclick="login()">로그인</button>
        <button onclick="logout()">로그아웃</button>
      </div>
      <div class="row">
        <button onclick="quick('seller@example.com','판매자')">판매자로</button>
        <button onclick="quick('other@example.com','다른회원')">다른 회원으로</button>
      </div>
    </section>

    <section style="margin-top:12px">
      <h2>2. 판매글 등록</h2>
      <label>교재명</label><input id="c-title" value="자료구조와 알고리즘">
      <label>저자</label><input id="c-author" value="홍길동">
      <label>가격</label><input id="c-price" type="number" value="15000">
      <label>카테고리</label>
      <select id="c-category"><option value="MAJOR">전공 (MAJOR)</option><option value="GENERAL">교양 (GENERAL)</option></select>
      <label>설명</label><textarea id="c-desc">필기 조금 있어요.</textarea>
      <label>거래 희망 장소 (선택)</label><input id="c-place" value="중앙도서관 앞">
      <div class="row"><button class="primary" onclick="createBook()">등록</button></div>
    </section>
  </div>

  <!-- 가운데: 목록 -->
  <section>
    <h2>3. 목록 · 검색</h2>
    <div class="row">
      <select id="f-category"><option value="">카테고리 전체</option><option>MAJOR</option><option>GENERAL</option></select>
      <select id="f-status"><option value="">상태 전체</option><option>ON_SALE</option><option>RESERVED</option><option>SOLD</option></select>
      <input id="f-keyword" placeholder="키워드 (교재명·저자)" onkeydown="if(event.key==='Enter')loadList()">
      <button class="primary" onclick="loadList()" style="flex:0">조회</button>
    </div>
    <div id="list"><p class="meta">로그인 후 [조회]를 누르세요.</p></div>
  </section>

  <!-- 오른쪽: 요청/응답 기록 -->
  <section>
    <h2>요청 · 응답 기록 <button onclick="document.getElementById('log').innerHTML=''" style="float:right;padding:2px 8px">지우기</button></h2>
    <div id="log"></div>
  </section>
</main>

<script>
let token = null;
let me = null;
const $ = id => document.getElementById(id);

async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  let res, data;
  try {
    res = await fetch($('host').value + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    const text = await res.text();
    try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  } catch (e) {
    log(method, path, body, 0, '서버에 연결할 수 없어요. 백엔드가 켜져 있는지, 이 페이지를 localhost:5173 으로 열었는지 확인하세요.\n' + e);
    throw e;
  }
  log(method, path, body, res.status, data);
  return { status: res.status, ok: res.ok, data };
}

function log(method, path, body, status, data) {
  const el = document.createElement('div');
  el.className = 'entry';
  const cls = status >= 200 && status < 300 ? 'ok' : 'err';
  el.innerHTML = `<b class="${cls}">${status}</b> ${method} ${path}`
    + (body ? `\n<span class="meta">요청: ${esc(JSON.stringify(body))}</span>` : '')
    + `\n${esc(typeof data === 'string' ? data : JSON.stringify(data, null, 2))}`;
  $('log').prepend(el);
}

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function signup() {
  await api('POST', '/auth/signup', { email: $('email').value, password: $('pw').value, nickname: $('nick').value });
}

async function login() {
  const r = await api('POST', '/auth/login', { email: $('email').value, password: $('pw').value });
  if (r.ok) {
    token = r.data.accessToken;
    const m = await api('GET', '/users/me');
    me = m.ok ? m.data : null;
    $('who').textContent = me ? `로그인: ${me.nickname} (id ${me.id})` : '로그인됨';
    loadList();
  }
}

function logout() { token = null; me = null; $('who').textContent = '로그인 안 됨'; }

async function quick(email, nick) {
  $('email').value = email; $('nick').value = nick;
  const s = await api('POST', '/auth/signup', { email, password: $('pw').value, nickname: nick });
  if (s.status === 201 || s.status === 409 || s.status === 400) await login();
}

async function createBook() {
  const r = await api('POST', '/books', {
    title: $('c-title').value, author: $('c-author').value, price: Number($('c-price').value),
    category: $('c-category').value, description: $('c-desc').value, tradePlace: $('c-place').value
  });
  if (r.ok) loadList();
}

async function loadList() {
  const q = new URLSearchParams();
  if ($('f-category').value) q.set('category', $('f-category').value);
  if ($('f-status').value) q.set('status', $('f-status').value);
  if ($('f-keyword').value.trim()) q.set('keyword', $('f-keyword').value.trim());
  const r = await api('GET', '/books' + (q.toString() ? '?' + q : ''));
  const list = $('list');
  if (!r.ok) { list.innerHTML = `<p class="err">${esc(r.data?.error?.message || '조회 실패')}</p>`; return; }
  if (!r.data.data.length) { list.innerHTML = '<p class="meta">판매글이 없어요.</p>'; return; }
  list.innerHTML = r.data.data.map(b => `
    <div class="book">
      <div><span class="t">${esc(b.title)}</span><span class="badge ${b.status}">${b.status}</span><span class="badge">${b.category}</span></div>
      <div class="meta">#${b.id} · ${esc(b.author)} · ${b.price.toLocaleString()}원 · ${esc(b.tradePlace || '장소 미정')}</div>
      <div class="meta">판매자 ${esc(b.seller.nickname)}(id ${b.seller.id})${b.buyer ? ' · 구매자 ' + esc(b.buyer.nickname) : ''} · ${b.createdAt?.slice(0,16).replace('T',' ')}</div>
      <div class="row">
        <input id="p-${b.id}" type="number" placeholder="새 가격">
        <button onclick="patchPrice(${b.id})">가격 수정(PATCH)</button>
      </div>
      <div class="row">
        <select id="s-${b.id}"><option>ON_SALE</option><option>RESERVED</option><option>SOLD</option></select>
        <input id="b-${b.id}" type="number" placeholder="buyerId (SOLD일 때 선택)">
        <button onclick="changeStatus(${b.id})">상태 변경</button>
      </div>
      <div class="row">
        <button onclick="api('GET','/books/${b.id}')">상세 조회</button>
        <button class="danger" onclick="removeBook(${b.id})">삭제</button>
      </div>
    </div>`).join('');
}

async function patchPrice(id) {
  const v = $('p-' + id).value;
  const r = await api('PATCH', '/books/' + id, { price: v === '' ? null : Number(v) });
  if (r.ok) loadList();
}

async function changeStatus(id) {
  const body = { status: $('s-' + id).value };
  const buyer = $('b-' + id).value;
  if (buyer !== '') body.buyerId = Number(buyer);
  const r = await api('PATCH', '/books/' + id + '/status', body);
  if (r.ok) loadList();
}

async function removeBook(id) {
  if (!confirm('#' + id + ' 판매글을 삭제할까요?')) return;
  const r = await api('DELETE', '/books/' + id);
  if (r.ok) loadList();
}
</script>
</body>
</html>
